services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: astrelune
      POSTGRES_USER: astrelune
      POSTGRES_PASSWORD: astrelune
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - astrelune-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrelune -d astrelune"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  astrelune-postgres:
